[package]
name = "plisto"
version = "2.7.1"
description = "A local-first music library manager"
authors = ["Altervayne"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plisto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# A local release build with the webview devtools enabled, to inspect a bug that only shows under the
# release CSP and origin. Never part of a shipped build.
diagnostic = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned exactly: the plugin frame sandbox rests on how this tauri, its tauri-runtime-wry and wry
# classify and deliver frame IPC. A bump means re-running the sandbox probe first; a cargo test
# fails while the lockfile drifts from the probed versions.
tauri = { version = "=2.12.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
# Routes a second launch (the OS opening a file while Plisto already runs) back into the live process
# instead of starting a new one, so a warm app plays the delivered file. Registered first in the plugin
# chain, as the plugin requires.
tauri-plugin-single-instance = "2"
# In-app updates from the signed latest.json on the public GitHub releases; process holds the relaunch.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2"
rayon = "1"
regex = "1"
lofty = "0.25"
# Frame-copy cutter for AAC .m4a/.m4b: reads the sample table and rewrites a fresh container holding a
# time range, no re-encode. Only the cut path uses it; analysis and playback decode m4a via symphonia.
mp4 = "0.14"
# Pure-Rust Ogg page reader/writer for the .opus cutter: remuxes a range of Opus packets into a fresh
# stream, no decode. Only the cut path uses it; analysis and playback demux Opus via symphonia.
ogg = "0.9"
crossbeam-channel = "0.5"
# Filesystem change notifications for keeping the library current. RecommendedWatcher is used bare:
# notify-debouncer-full's Windows file-id cache walks the whole tree on every watch.
notify = "8"
# The decode half of the shared audio core. default-features off, then only the codecs/containers the
# library indexes: WAV/PCM, FLAC, MP3, AAC, ALAC in ISO-MP4, and Ogg Vorbis. Opus is left out on
# purpose - symphonia ships no production Opus decoder, so it is deferred end to end.
# Pinned exactly: the stream guards mirror this version's parsers; repeat their audit on any upgrade.
symphonia = { version = "=0.5.5", default-features = false, features = [
    "wav",
    "pcm",
    "flac",
    "mp3",
    "aac",
    "alac",
    "isomp4",
    "ogg",
    "vorbis",
] }
# Pure-Rust Opus decoder (a libopus-1.6 port): zero deps, no C, no CMake. It decodes the Ogg-Opus
# packets symphonia demuxes, so .opus plays through the same shared audio core as every other codec.
opus-rs = "0.1.32"
# Realtime playback for the player engine. default-features off drops rodio's own symphonia decoders:
# the engine feeds PCM through a custom Source built on the shared audio core, so the mp3/flac/etc
# feature set is dead weight. Pinned to 0.20 - 0.21 replaced OutputStream::try_default()/Sink::try_new
# with an OutputStreamBuilder, and the engine uses the 0.19/0.20 API.
rodio = { version = "0.20", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
blake3 = "1"
# Reads `.plistoplugin` archives. Stored and deflate only, through the flate2 backend already in the
# tree; every member is written by the installer itself, never by the crate's extract helpers. Shared
# with the updater, so a feature added here changes its zip too.
zip = { version = "9.4", default-features = false, features = ["deflate-flate2"] }
dunce = "1"
# Encodes a plugin icon as a data: URL.
base64 = "0.22"
unicode-normalization = "0.1"
# The HTTP client behind plugin network requests. Shared with the updater, so a feature added here
# changes its client too: rustls without a bundled crypto provider, as the updater builds it.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# Installs ring as the process crypto provider before the first client is built, as the updater does,
# and names TLS failures. The same rustls and features the updater already uses.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# WebSocket frame codec over a connection the plugin network client upgrades; no handshake or TLS of its own.
tokio-tungstenite = { version = "0.30", default-features = false }
futures-util = "0.3"
# The client's own HTTP/1.1 layer, named only to tell a connection closed early from malformed bytes.
hyper = { version = "1", default-features = false }
# Already in the tree through rustls; used for the WebSocket accept digest and handshake key.
ring = "0.17"
tokio = { version = "1", features = ["sync", "time", "macros"] }

# Windows-only: the shell/COM surface for MTP direct-to-device export (1.6.0). cfg-gated so non-Windows
# builds never pull it. #[implement] (the progress sink, P2) emits windows_core:: paths, so the
# standalone crate is a direct dep too.
[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_System_Pipes",
    "Win32_System_WindowsProgramming",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Media",
    "Storage",
    "Storage_Streams",
    "Foundation",
    "implement",
] }
# The plugin frame host's WebView2 handler. These are the exact versions wry builds against, so the
# controller `with_webview` hands out has the same types as these imports.
webview2-com = "=0.39.1"
windows62 = { package = "windows", version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
# A local TLS test server for the plugin network client: a throwaway CA and certificates, and the
# server side of the handshake. Both on ring, like the client.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "io-util"] }

# The decode helper tests read a registry key and start the socket stack from inside the AppContainer.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = ["Win32_System_Registry", "Win32_Networking_WinSock"] }
