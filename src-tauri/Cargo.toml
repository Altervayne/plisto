[package]
name = "plisto"
version = "1.6.1"
description = "A local-first music library manager"
authors = ["Altervayne"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plisto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2"
rayon = "1"
regex = "1"
lofty = "0.25"
crossbeam-channel = "0.5"
# The decode half of the shared audio core. default-features off, then only the codecs/containers the
# library indexes: WAV/PCM, FLAC, MP3, AAC, ALAC in ISO-MP4, and Ogg Vorbis. Opus is left out on
# purpose - symphonia ships no production Opus decoder, so it is deferred end to end.
symphonia = { version = "0.5", default-features = false, features = [
    "wav",
    "pcm",
    "flac",
    "mp3",
    "aac",
    "alac",
    "isomp4",
    "ogg",
    "vorbis",
] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
blake3 = "1"
dunce = "1"
unicode-normalization = "0.1"

# Windows-only: the shell/COM surface for MTP direct-to-device export (1.6.0). cfg-gated so non-Windows
# builds never pull it. #[implement] (the progress sink, P2) emits windows_core:: paths, so the
# standalone crate is a direct dep too.
[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "implement",
] }

